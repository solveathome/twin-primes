	function isPrime(n) {
		if (n%2==0) return (n==2);
		if (n%3==0) return (n==3);
		var m=Math.sqrt(n);
		for (var i=5;i<=m;i+=6) {
			if (n%i==0)     return false;
			if (n%(i+2)==0) return false;
		}
		return true;
	}

	function factor(number){
		var sqrt = Math.sqrt(number)

		ctx.fillStyle = "#000000";
		ctx.clearRect(0, 0, 2000,2000);

		var offsety = 0//number - 100

		for( var a=2;a<=number*2;a++){

			var y = 0;
			var offset = 0;
			while(y<number){

				var col = (offset%5)*50

				ctx.fillStyle = "rgb("+col+","+col+","+col+")"
				offset++

				ctx.fillRect(a*4, y+1-offsety, 2, a);
				y+=a;
			}

			if(number%a == 0){
				ctx.fillStyle = "#ffffff";
				ctx.fillRect(a*4, y+1-offsety, 2, 4);
				ctx.fillStyle = "#000000";
			}


		}

		ctx.fillStyle = "rgba(255,255,255,.5)";
		ctx.fillRect(0, number-offsety, number*1, 1);




	}

	var offset = 29*31


	document.body.onmousedown = function(){
		factor(offset++)

	}
